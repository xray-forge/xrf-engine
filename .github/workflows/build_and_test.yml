name: build-and-test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]
        shard: [1, 2, 3, 4, 5]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - run: npm ci

      - name: Restore jest cache
        id: cache-jest-restore
        uses: actions/cache/restore@v5
        with:
          path: target/jest_cache
          key: jest-${{ hashFiles('**/package-lock.json') }}-${{ matrix.shard }}

      - run: npm test -- --shard=${{ matrix.shard }}/${{ strategy.job-total }} --maxWorkers=100%

      - name: Save jest cache
        if: ${{ steps.cache-jest-restore.outputs.cache-hit != 'true' && github.event_name != 'pull_request' }}
        id: cache-jest-save
        uses: actions/cache/save@v5
        with:
          path: target/jest_cache
          key: ${{ steps.cache-jest-restore.outputs.cache-primary-key }}

  check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Fetch pinned xrf-cli tools
        shell: bash
        run: |
          submodule_commit="$(git rev-parse HEAD:cli/bin)"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/xray-forge/xrf-engine-bin.git cli/bin
          git -C cli/bin sparse-checkout set tools
          git -C cli/bin fetch --depth=1 origin "$submodule_commit"
          git -C cli/bin checkout --detach "$submodule_commit"

      - name: Restore eslint cache
        id: cache-eslint-restore
        uses: actions/cache/restore@v5
        with:
          path: target/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'cli/lint/eslint.config.mjs') }}

      - name: Restore prettier cache
        id: cache-prettier-restore
        uses: actions/cache/restore@v5
        with:
          path: target/prettier
          key: prettier-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json', '.prettierrc.json', '.prettierignore') }}

      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:checks
      - run: npm run typecheck:tests
      - run: npm run format:check
      - run: npm run lint
      - run: npm run cli format ltx -- --check
      - run: npm run cli verify ltx

      - name: Save eslint cache
        id: cache-eslint-save
        uses: actions/cache/save@v5
        with:
          path: target/eslint
          key: ${{ steps.cache-eslint-restore.outputs.cache-primary-key }}

      - name: Save prettier cache
        id: cache-prettier-save
        uses: actions/cache/save@v5
        with:
          path: target/prettier
          key: ${{ steps.cache-prettier-restore.outputs.cache-primary-key }}

  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Fetch pinned xrf-cli tools
        shell: bash
        run: |
          submodule_commit="$(git rev-parse HEAD:cli/bin)"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/xray-forge/xrf-engine-bin.git cli/bin
          git -C cli/bin sparse-checkout set tools
          git -C cli/bin fetch --depth=1 origin "$submodule_commit"
          git -C cli/bin checkout --detach "$submodule_commit"

      - name: Fetch pinned resource LFS pointers
        shell: bash
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          git submodule update --init --depth=1 --single-branch src/resources

      - run: npm ci
      - run: npm run pack:mod -- --se
